name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Only Python 3.12 has been verified end-to-end for this
          # project; other versions are not claimed to work.
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build pytest

      - name: Build wheels and sdists
        run: |
          python -m build --outdir dist baidu-search-parser
          python -m build --outdir dist baidu-search-client

      - name: Install packages from the locally built wheels
        # baidu-parser is not published on PyPI; it is resolved from the
        # local dist directory via --find-links.
        run: python -m pip install --find-links dist baidu-search

      - name: Import check outside the source tree
        working-directory: /tmp
        run: |
          python -c "import baidu_parser, baidu_search"
          python -c "from baidu_search import BaiduSearchClient; from baidu_parser import parse_search_results; print('imports ok')"

      # The test suites are fully offline: HTTP is mocked and parsing is
      # done against bundled, redacted fixtures. CI never contacts
      # Baidu's servers.
      - name: Run baidu_parser tests
        run: python -m pytest baidu-search-parser/tests -q

      - name: Run baidu_search tests
        run: python -m pytest baidu-search-client/tests -q
