[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baidu-search"
version = "1.0.0"
description = "Python client for Baidu Search with pagination and structured results."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    # AES for the ant_ct token (baidu_search/antct.py).
    "pycryptodome>=3.19",
    # HTML parsing.
    "baidu-parser>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
baidu-search = "baidu_search.cli:main"

[tool.setuptools.packages.find]
include = ["baidu_search*"]
